name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master
      - 'claude/portfolio-allocation-strategy-*'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Fetch monthly returns server-side into public/data/returns.json so the
      # site loads market data same-origin (no browser CORS proxies needed).
      # Never fails the deploy: on a Yahoo outage the committed snapshot is kept.
      - name: Refresh market data snapshot
        run: node scripts/fetch-returns.mjs
        continue-on-error: true

      - name: Build
        run: npm run build
        env:
          GITHUB_ACTIONS: 'true'

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
