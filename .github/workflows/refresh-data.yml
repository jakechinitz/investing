name: Refresh market data

# Rebuilds public/data/returns.json from Yahoo Finance and commits it (plus a
# snapshot-status.json diagnostic) to the default branch when changed, then
# dispatches the Pages deploy (pushes made with GITHUB_TOKEN do not trigger
# `on: push` workflows on their own).
#
# Runs daily, on demand, and whenever the fetch script / asset list / this
# workflow changes on the default branch — so a fix ships a fresh snapshot.

on:
  schedule:
    - cron: '20 6 * * *'   # daily, 06:20 UTC
  workflow_dispatch:
  push:
    branches:
      - main
      - master
      - 'claude/portfolio-allocation-strategy-*'
    paths:
      - 'scripts/fetch-returns.mjs'
      - 'src/data/fetchReturns.js'
      - 'src/data/assets.js'
      - '.github/workflows/refresh-data.yml'

permissions:
  contents: write
  actions: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build snapshot
        run: node scripts/fetch-returns.mjs

      - name: Commit snapshot + status if changed
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/returns.json public/data/snapshot-status.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Nothing to commit."
            exit 0
          fi
          git commit -m "Refresh market data snapshot ($(date -u +%Y-%m-%d))"
          git pull --rebase origin "${{ github.event.repository.default_branch }}" || true
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Trigger Pages deploy
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref "${{ github.event.repository.default_branch }}"
